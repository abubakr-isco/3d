<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noema — Envision. Materialize.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Italiana&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/noema.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070b22'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%236d8ef0'/%3E%3C/svg%3E" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <main class="hero">
    <header class="header reveal">
      <div class="header__left">
        <a href="#" class="brand">Noema</a>
        <div class="meta">
          <span id="clock">9:45 AM, CET</span>
          <a href="mailto:hello@noema.ai">hello@noema.ai</a>
        </div>
      </div>
      <div class="header__right">
        <nav class="menu" id="site-nav">
          <a href="#">Work</a>
          <a href="#">Exhibitions</a>
          <a href="#">Stories</a>
          <a href="#">About</a>
        </nav>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
        <a href="mailto:hello@noema.ai" class="talk">Let's Talk
          <svg viewBox="0 0 8 8" fill="none" stroke="#fff" stroke-width="1.1"><path d="M1 7 L7 1 M2.4 1 H7 V5.6" /></svg>
        </a>
      </div>
    </header>

    <h1 class="word word--left reveal" style="animation-delay: 0.4s">ENVISION</h1>
    <h1 class="word word--right reveal" style="animation-delay: 0.6s">MATERIALIZE</h1>

    <div class="intro reveal" style="animation-delay: 0.9s">
      <p>Art direction, identity, and interactive web. AI is our instrument — the intent is ours.</p>
      <div class="buttons">
        <a href="#" class="button button--light">Start a Project</a>
        <a href="#" class="button button--dark">See the Work</a>
      </div>
    </div>

    <a href="#" class="featured reveal" style="animation-delay: 1.1s">
      <div class="featured__thumb"></div>
      <div class="featured__body">
        <div class="featured__top">
          Featured work
          <svg viewBox="0 0 8 8" fill="none" stroke="#0b0c12" stroke-width="1.1"><path d="M1 7 L7 1 M2.4 1 H7 V5.6" /></svg>
        </div>
        <div class="featured__title">Forma, Website</div>
        <div class="featured__tags">Art Direction, Design, WebGL</div>
      </div>
    </a>
  </main>

  <script>
    // live clock in Central European Time
    const clock = document.getElementById("clock");
    const fmt = new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit", hour12: true, timeZone: "Europe/Paris" });
    const updateClock = () => (clock.textContent = fmt.format(new Date()) + ", CET");
    updateClock();
    setInterval(updateClock, 10000);

    // mobile menu
    const header = document.querySelector(".header");
    const toggle = document.querySelector(".menu-toggle");
    toggle.addEventListener("click", () => {
      const open = header.classList.toggle("is-open");
      toggle.setAttribute("aria-expanded", open);
      toggle.textContent = open ? "Close" : "Menu";
    });
    document.querySelectorAll(".menu a").forEach((a) => a.addEventListener("click", () => {
      header.classList.remove("is-open");
      toggle.setAttribute("aria-expanded", "false");
      toggle.textContent = "Menu";
    }));
  </script>

  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    const canvas = document.getElementById("scene");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
    const DPR = Math.min(window.devicePixelRatio, 2);
    renderer.setPixelRatio(DPR);
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
    const uTime = { value: 0 };

    // ---------- background: deep blue with light beams ----------
    const bg = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.ShaderMaterial({
        depthTest: false,
        depthWrite: false,
        uniforms: { uTime, uAspect: { value: 1 } },
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.0); }`,
        fragmentShader: /* glsl */ `
          uniform float uTime, uAspect;
          varying vec2 vUv;
          float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
          float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
            return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
          float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ v += a * noise(p); p *= 2.03; a *= 0.5; } return v; }
          void main(){
            vec2 p = vec2((vUv.x - 0.5) * uAspect, vUv.y - 0.5);
            vec3 col = vec3(0.02, 0.03, 0.1);

            // soft glow behind the head
            col += vec3(0.05, 0.09, 0.3) * exp(-dot(p - vec2(0.0, 0.05), p - vec2(0.0, 0.05)) * 3.5);

            // soft diagonal light beams
            vec2 dir = normalize(vec2(1.0, 0.48));
            vec2 nrm = vec2(-dir.y, dir.x);
            float v = dot(p, nrm), u = dot(p, dir);
            float bands = pow(0.5 + 0.5 * sin(v * 7.0 + noise(vec2(v * 1.5, uTime * 0.05)) * 3.0 + uTime * 0.08), 4.0);
            bands *= smoothstep(0.15, 0.85, noise(vec2(u * 1.2 - uTime * 0.04, v * 2.5 + 4.0)));
            float side = smoothstep(0.05, 0.6, abs(p.x)) * 0.75 + 0.25;
            col += vec3(0.16, 0.27, 0.8) * bands * side * (0.35 + 0.65 * smoothstep(-0.5, 0.4, p.y)) * 0.6;

            // drifting haze
            float h = fbm(p * 2.2 + vec2(uTime * 0.02, -uTime * 0.015));
            col += vec3(0.03, 0.05, 0.16) * smoothstep(0.4, 0.85, h);

            // stars
            vec2 sp = vUv * vec2(uAspect, 1.0) * 260.0;
            vec2 cell = floor(sp);
            float r = hash(cell);
            float star = step(0.985, r) * smoothstep(0.28, 0.0, length(fract(sp) - 0.5));
            star *= 0.5 + 0.5 * sin(uTime * (1.0 + r * 4.0) + r * 80.0);
            col += vec3(0.75, 0.82, 1.0) * star * 0.9;

            // vignette
            col *= 1.0 - smoothstep(0.45, 1.0, length(p * vec2(0.8, 1.0))) * 0.55;
            gl_FragColor = vec4(pow(col, vec3(2.2)), 1.0);
          }`,
      })
    );
    bg.frustumCulled = false;
    bg.renderOrder = -1;
    scene.add(bg);

    // ---------- procedural head as a signed distance field ----------
    const V = (x, y, z) => [x, y, z];
    function ellipsoid(p, c, r) {
      const x = (p[0] - c[0]) / r[0], y = (p[1] - c[1]) / r[1], z = (p[2] - c[2]) / r[2];
      const k0 = Math.sqrt(x * x + y * y + z * z);
      const k1 = Math.sqrt(x * x / (r[0] * r[0]) + y * y / (r[1] * r[1]) + z * z / (r[2] * r[2]));
      return k1 === 0 ? -Math.min(...r) : (k0 * (k0 - 1)) / k1;
    }
    function sphere(p, c, r) {
      return Math.hypot(p[0] - c[0], p[1] - c[1], p[2] - c[2]) - r;
    }
    function capsule(p, a, b, r) {
      const pa = [p[0] - a[0], p[1] - a[1], p[2] - a[2]];
      const ba = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
      const h = Math.min(Math.max((pa[0] * ba[0] + pa[1] * ba[1] + pa[2] * ba[2]) / (ba[0] * ba[0] + ba[1] * ba[1] + ba[2] * ba[2]), 0), 1);
      return Math.hypot(pa[0] - ba[0] * h, pa[1] - ba[1] * h, pa[2] - ba[2] * h) - r;
    }
    const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; };
    const smax = (a, b, k) => -smin(-a, -b, k);

    function headSDF(p) {
      let d = ellipsoid(p, V(0, 0.28, -0.12), V(0.8, 0.83, 0.92));               // cranium
      d = smin(d, ellipsoid(p, V(0, -0.05, 0.2), V(0.6, 0.72, 0.7)), 0.25);      // face mass
      d = smin(d, ellipsoid(p, V(0, -0.55, 0.25), V(0.46, 0.36, 0.55)), 0.25);   // jaw
      d = smin(d, sphere(p, V(0, -0.78, 0.58), 0.2), 0.18);                       // chin
      d = smin(d, sphere(p, V(0.4, -0.1, 0.56), 0.2), 0.15);                      // cheekbones
      d = smin(d, sphere(p, V(-0.4, -0.1, 0.56), 0.2), 0.15);
      d = smin(d, ellipsoid(p, V(0, 0.2, 0.74), V(0.5, 0.12, 0.17)), 0.12);      // brow
      d = smin(d, ellipsoid(p, V(0, -0.14, 0.9), V(0.1, 0.24, 0.16)), 0.08);     // nose
      d = smin(d, ellipsoid(p, V(0, -0.5, 0.84), V(0.21, 0.08, 0.1)), 0.06);     // lips
      d = smax(d, -sphere(p, V(0.24, 0.04, 0.9), 0.12), 0.08);                    // eye sockets
      d = smax(d, -sphere(p, V(-0.24, 0.04, 0.9), 0.12), 0.08);
      d = smin(d, ellipsoid(p, V(0.72, -0.05, -0.04), V(0.09, 0.26, 0.16)), 0.08); // ears
      d = smin(d, ellipsoid(p, V(-0.72, -0.05, -0.04), V(0.09, 0.26, 0.16)), 0.08);
      d = smin(d, capsule(p, V(0, -0.45, -0.2), V(0, -2.6, -0.1), 0.34), 0.3);    // neck
      return d;
    }
    function gradient(p) {
      const e = 0.002;
      return [
        headSDF([p[0] + e, p[1], p[2]]) - headSDF([p[0] - e, p[1], p[2]]),
        headSDF([p[0], p[1] + e, p[2]]) - headSDF([p[0], p[1] - e, p[2]]),
        headSDF([p[0], p[1], p[2] + e]) - headSDF([p[0], p[1], p[2] - e]),
      ];
    }
    // value noise for clumpy density
    const vhash = (x, y, z) => { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); };
    function vnoise(x, y, z) {
      const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
      const f = (t) => t * t * (3 - 2 * t);
      const xf = f(x - xi), yf = f(y - yi), zf = f(z - zi);
      const L = (a, b, t) => a + (b - a) * t;
      return L(
        L(L(vhash(xi, yi, zi), vhash(xi + 1, yi, zi), xf), L(vhash(xi, yi + 1, zi), vhash(xi + 1, yi + 1, zi), xf), yf),
        L(L(vhash(xi, yi, zi + 1), vhash(xi + 1, yi, zi + 1), xf), L(vhash(xi, yi + 1, zi + 1), vhash(xi + 1, yi + 1, zi + 1), xf), yf),
        zf
      );
    }

    const COUNT = window.innerWidth < 800 ? 30000 : 58000;
    const positions = new Float32Array(COUNT * 3);
    const normals = new Float32Array(COUNT * 3);
    const rands = new Float32Array(COUNT);
    let n = 0, guard = 0;
    while (n < COUNT && guard < COUNT * 40) {
      guard++;
      let p = [(Math.random() * 2 - 1) * 0.95, -2.6 + Math.random() * 3.75, -1.1 + Math.random() * 2.25];
      let d = headSDF(p);
      if (Math.abs(d) > 0.3) continue;
      let g;
      for (let k = 0; k < 3; k++) {
        g = gradient(p);
        const gl = Math.hypot(g[0], g[1], g[2]) || 1;
        g = [g[0] / gl, g[1] / gl, g[2] / gl];
        d = headSDF(p);
        p = [p[0] - g[0] * d, p[1] - g[1] * d, p[2] - g[2] * d];
      }
      // fewer particles low on the neck, clumpy elsewhere
      const neckFade = Math.min(Math.max((p[1] + 1.9) / 1.2, 0), 1);
      const clump = vnoise(p[0] * 4 + 10, p[1] * 4, p[2] * 4);
      if (Math.random() > neckFade * (0.35 + clump * 0.9)) continue;
      // scatter some particles off the surface
      const off = Math.random() < 0.88 ? (Math.random() - 0.5) * 0.03 : Math.random() * 0.25;
      positions[n * 3] = p[0] + g[0] * off;
      positions[n * 3 + 1] = p[1] + g[1] * off;
      positions[n * 3 + 2] = p[2] + g[2] * off;
      normals[n * 3] = g[0];
      normals[n * 3 + 1] = g[1];
      normals[n * 3 + 2] = g[2];
      rands[n] = Math.random();
      n++;
    }

    const headGeo = new THREE.BufferGeometry();
    headGeo.setAttribute("position", new THREE.BufferAttribute(positions.subarray(0, n * 3), 3));
    headGeo.setAttribute("normal", new THREE.BufferAttribute(normals.subarray(0, n * 3), 3));
    headGeo.setAttribute("aRand", new THREE.BufferAttribute(rands.subarray(0, n), 1));

    const headMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime,
        uPixel: { value: DPR },
        uLight: { value: new THREE.Vector3(-0.6, 0.75, 0.2).normalize() },
        uMouse: { value: new THREE.Vector3(99, 99, 0) },
        uIntro: { value: 0 },
      },
      vertexShader: /* glsl */ `
        attribute float aRand;
        uniform float uTime, uPixel, uIntro;
        uniform vec3 uLight, uMouse;
        varying float vB;
        varying float vA;
        void main(){
          vec3 n = normalize(mat3(modelMatrix) * normal);
          vec3 p = position;
          // breathing shimmer along the normal
          p += normal * sin(uTime * 0.9 + aRand * 40.0 + position.y * 3.0) * 0.012;
          // intro: particles gather from a loose cloud
          vec3 scatter = vec3(sin(aRand * 91.0), cos(aRand * 57.0), sin(aRand * 23.0)) * 2.5;
          p = mix(p + scatter, p, uIntro);

          vec4 wp = modelMatrix * vec4(p, 1.0);
          // push particles away from the cursor
          vec3 toM = wp.xyz - uMouse;
          float md = length(toM.xy);
          wp.xyz += normalize(vec3(toM.xy, 0.0001)).xyz * exp(-md * md * 6.0) * 0.18;

          vec4 mv = viewMatrix * wp;
          float lam = max(dot(n, uLight), 0.0);
          float rim = pow(1.0 - abs(dot(n, normalize(-mv.xyz))), 3.0);
          vB = 0.05 + pow(lam, 1.5) * 1.6 + rim * 0.22;
          vB *= 0.6 + 0.4 * sin(uTime * (1.0 + aRand * 3.0) + aRand * 60.0);
          vA = smoothstep(-2.0, -0.7, position.y);
          gl_PointSize = (1.0 + pow(aRand, 3.0) * 2.6) * uPixel * (6.8 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: /* glsl */ `
        varying float vB;
        varying float vA;
        void main(){
          float d = length(gl_PointCoord - 0.5);
          if (d > 0.5) discard;
          float a = smoothstep(0.5, 0.1, d);
          vec3 col = mix(vec3(0.3, 0.45, 1.0), vec3(1.0, 0.97, 0.95), clamp(vB * 1.2 - 0.2, 0.0, 1.0));
          gl_FragColor = vec4(col * vB * a * vA, 1.0);
        }`,
    });
    const head = new THREE.Points(headGeo, headMat);
    head.frustumCulled = false;
    scene.add(head);

    // floating dust around the head
    {
      const N = 1400;
      const g = new THREE.BufferGeometry();
      const p = new Float32Array(N * 3), r = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        p[i * 3] = (Math.random() - 0.5) * 9;
        p[i * 3 + 1] = (Math.random() - 0.5) * 6 - 0.5;
        p[i * 3 + 2] = (Math.random() - 0.5) * 5;
        r[i] = Math.random();
      }
      g.setAttribute("position", new THREE.BufferAttribute(p, 3));
      g.setAttribute("aRand", new THREE.BufferAttribute(r, 1));
      const dust = new THREE.Points(g, new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        uniforms: { uTime, uPixel: { value: DPR } },
        vertexShader: /* glsl */ `
          attribute float aRand;
          uniform float uTime, uPixel;
          varying float vA;
          void main(){
            vec3 p = position;
            p.y += mod(uTime * 0.04 * (0.5 + aRand) + aRand * 6.0, 6.0) - 3.0;
            p.x += sin(uTime * 0.2 + aRand * 30.0) * 0.2;
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = (1.0 + aRand * 1.8) * uPixel;
            vA = (0.35 + 0.65 * sin(uTime * 1.5 + aRand * 50.0)) * 0.8;
            gl_Position = projectionMatrix * mv;
          }`,
        fragmentShader: /* glsl */ `
          varying float vA;
          void main(){
            float d = length(gl_PointCoord - 0.5);
            if (d > 0.5) discard;
            gl_FragColor = vec4(vec3(0.7, 0.8, 1.0) * smoothstep(0.5, 0.0, d) * vA, 1.0);
          }`,
      }));
      dust.frustumCulled = false;
      scene.add(dust);
    }

    // ---------- post: bloom + chromatic aberration + grain ----------
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.45, 0.3));
    const finish = new ShaderPass({
      uniforms: { tDiffuse: { value: null }, uTime, uRes: { value: new THREE.Vector2() } },
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: /* glsl */ `
        uniform sampler2D tDiffuse;
        uniform float uTime;
        uniform vec2 uRes;
        varying vec2 vUv;
        float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
        void main(){
          vec2 c = vUv - 0.5;
          vec2 off = c * 0.0035 + vec2(1.5, 0.0) / uRes;
          float r = texture2D(tDiffuse, vUv + off).r;
          float g = texture2D(tDiffuse, vUv).g;
          float b = texture2D(tDiffuse, vUv - off).b;
          vec3 col = vec3(r, g, b);
          col += (hash(vUv * uRes + fract(uTime) * 100.0) - 0.5) * 0.018;
          gl_FragColor = vec4(col, 1.0);
        }`,
    });
    composer.addPass(finish);
    composer.addPass(new OutputPass());

    function layout() {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      // narrow screens: back off just enough for the head to fill ~72% of the width
      const dist = Math.max(6.8, 1.65 / (0.72 * 0.5359 * camera.aspect));
      camera.position.set(0, -0.55, dist);
      camera.lookAt(0, -0.55, 0);
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      bg.material.uniforms.uAspect.value = camera.aspect;
      finish.uniforms.uRes.value.set(w * DPR, h * DPR);
    }
    layout();
    window.addEventListener("resize", layout);

    // ---------- interaction ----------
    const mouse = new THREE.Vector2(0, 0), smooth = new THREE.Vector2();
    const ndc = new THREE.Vector2(9, 9);
    const ray = new THREE.Raycaster();
    const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const hit = new THREE.Vector3();
    window.addEventListener("pointermove", (e) => {
      mouse.set((e.clientX / window.innerWidth) * 2 - 1, (e.clientY / window.innerHeight) * 2 - 1);
      ndc.set(mouse.x, -mouse.y);
    });

    const clock = new THREE.Clock();
    function tick() {
      const t = clock.getElapsedTime();
      uTime.value = t;
      smooth.lerp(mouse, 0.035);

      // the face looks to the right and slightly away, slowly turning
      head.rotation.y = -2.65 + Math.sin(t * 0.22) * 0.25 + smooth.x * 0.25;
      head.rotation.x = 0.06 + Math.sin(t * 0.17) * 0.05 + smooth.y * 0.08;
      head.rotation.z = Math.sin(t * 0.13) * 0.03;
      headMat.uniforms.uIntro.value = 1 - Math.pow(1 - Math.min(t / 2.8, 1), 3);

      ray.setFromCamera(ndc, camera);
      if (ray.ray.intersectPlane(plane, hit)) headMat.uniforms.uMouse.value.copy(hit);

      composer.render();
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
